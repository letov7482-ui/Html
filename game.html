<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Сценки</title>
<style>
  :root{
    --bg1:#1a0d14; --bg2:#2b0f1c; --accent:#e0446e; --accent2:#ff7ba0;
    --text:#f5e6ec; --dim:#a8849a; --panel:rgba(20,8,14,.82);
    --ok:#4fd08a; --warn:#ffcc55;
    --arousal:0%;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    font-family: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    background: radial-gradient(circle at 50% 20%, var(--bg2), var(--bg1) 70%);
    color:var(--text); overflow:hidden; user-select:none;
    transition: background 1.2s ease;
  }
  body[data-stage="undress"]{--bg1:#1c0a12; --bg2:#3a0f22;}
  body[data-stage="oral"]{--bg1:#200a16; --bg2:#4a1028;}
  body[data-stage="sex"]{--bg1:#26091a; --bg2:#5a0f30;}
  body[data-stage="climax"]{--bg1:#2e0820; --bg2:#7a1240;}
  body.high{animation:pulse 1.6s ease-in-out infinite;}
  @keyframes pulse{0%,100%{filter:brightness(1);}50%{filter:brightness(1.12);}}

  #app{display:flex; flex-direction:column; height:100dvh; max-width:720px; margin:0 auto; padding:10px; gap:8px;}

  /* ==== сцена / спрайт ==== */
  #stage{
    position:relative; flex:1 1 42%; min-height:180px; border-radius:16px;
    overflow:hidden; background:linear-gradient(160deg,#3a1424,#180810);
    display:flex; align-items:center; justify-content:center;
    box-shadow: inset 0 0 80px rgba(0,0,0,.6);
  }
  #sprite{
    width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    font-size:clamp(60px,18vw,140px);
    transition: transform .5s ease, opacity .6s ease;
    opacity:.9;
  }
  body.high #sprite{animation:breathe 1.4s ease-in-out infinite;}
  @keyframes breathe{0%,100%{transform:scale(1);}50%{transform:scale(1.04);}}
  #stageLabel{
    position:absolute; left:12px; bottom:10px; font-size:12px; letter-spacing:.5px;
    color:var(--dim); text-transform:uppercase;
  }
  #timer{position:absolute; right:12px; top:10px; font-size:12px; color:var(--dim);}

  /* ==== полоса возбуждения ==== */
  #arousalWrap{height:14px; border-radius:8px; background:rgba(255,255,255,.07); overflow:hidden; position:relative;}
  #arousalBar{height:100%; width:var(--arousal); background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width .4s ease;}
  #arousalTxt{position:absolute; inset:0; font-size:10px; text-align:center; line-height:14px; color:#fff; text-shadow:0 0 3px #000;}

  /* ==== лог ==== */
  #log{
    flex:1 1 30%; overflow-y:auto; background:var(--panel); border-radius:14px;
    padding:12px 14px; font-size:15px; line-height:1.5; scroll-behavior:smooth;
    border:1px solid rgba(255,255,255,.06);
  }
  #log p{margin:0 0 8px;}
  #log .narr{color:var(--text);}
  #log .act{color:var(--accent2); font-style:italic;}
  #log .sys{color:var(--dim); font-size:13px;}
  #log .climax{color:var(--warn); font-weight:600;}

  /* ==== одежда / инвентарь ==== */
  #clothes{display:flex; gap:6px; flex-wrap:wrap; font-size:12px; min-height:20px;}
  #clothes span{padding:2px 8px; border-radius:20px; background:rgba(255,255,255,.08); color:var(--dim); text-decoration:line-through;}
  #clothes span.on{color:var(--text); text-decoration:none; background:rgba(224,68,110,.25);}

  /* ==== кнопки действий ==== */
  #actions{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:8px;}
  .btn{
    appearance:none; border:1px solid rgba(255,255,255,.1);
    background:linear-gradient(180deg,rgba(224,68,110,.22),rgba(224,68,110,.08));
    color:var(--text); padding:11px 10px; border-radius:12px; font-size:14px;
    cursor:pointer; transition:transform .08s, background .2s, opacity .2s; position:relative;
    text-align:center;
  }
  .btn:hover{background:linear-gradient(180deg,rgba(224,68,110,.4),rgba(224,68,110,.15));}
  .btn:active{transform:scale(.96);}
  .btn .key{position:absolute; top:4px; left:7px; font-size:10px; color:var(--dim);}
  .btn[disabled]{opacity:.35; cursor:not-allowed; filter:grayscale(.4);}
  .btn.hot{border-color:var(--accent); box-shadow:0 0 14px rgba(224,68,110,.35);}

  /* ==== верхняя панель ==== */
  #top{display:flex; gap:8px; align-items:center; font-size:12px; color:var(--dim);}
  #top button{background:none; border:1px solid rgba(255,255,255,.12); color:var(--dim);
    border-radius:8px; padding:4px 9px; cursor:pointer; font-size:12px;}
  #top button:hover{color:var(--text); border-color:var(--accent);}
  .spacer{flex:1;}

  /* ==== тост ==== */
  #toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(80px);
    background:rgba(0,0,0,.85); color:var(--text); padding:9px 16px; border-radius:20px;
    font-size:13px; opacity:0; transition:.35s; pointer-events:none; z-index:50;}
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* ==== модалка ==== */
  #modal{position:fixed; inset:0; background:rgba(0,0,0,.72); display:none;
    align-items:center; justify-content:center; z-index:100; padding:20px;}
  #modal.open{display:flex;}
  #modalBox{background:#1a0d14; border:1px solid rgba(224,68,110,.3); border-radius:16px;
    padding:20px; max-width:420px; width:100%; max-height:80vh; overflow:auto;}
  #modalBox h3{margin:0 0 12px; color:var(--accent2);}
  #modalBox textarea{width:100%; height:160px; background:#0f060a; color:var(--text);
    border:1px solid rgba(255,255,255,.1); border-radius:10px; padding:10px; font-size:12px;
    font-family:monospace; resize:vertical;}
  #modalBox button{margin-top:10px; margin-right:6px;}

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:rgba(224,68,110,.35); border-radius:8px;}
  ::-webkit-scrollbar-track{background:transparent;}
</style>
</head>
<body data-stage="start">
<div id="app">

  <div id="top">
    <span id="title">Сценки</span>
    <span class="spacer"></span>
    <button id="btnSound" title="звук">🔇</button>
    <button id="btnSave" title="сохранить">💾</button>
    <button id="btnExport" title="экспорт">📤</button>
    <button id="btnImport" title="импорт">📥</button>
    <button id="btnReset" title="сброс">♻</button>
  </div>

  <div id="stage">
    <div id="sprite">🛏️</div>
    <div id="stageLabel">начало</div>
    <div id="timer">00:00</div>
  </div>

  <div id="arousalWrap">
    <div id="arousalBar"></div>
    <div id="arousalTxt">0%</div>
  </div>

  <div id="clothes"></div>
  <div id="log"></div>
  <div id="actions"></div>
</div>

<div id="toast"></div>

<div id="modal"><div id="modalBox">
  <h3 id="modalTitle">Экспорт</h3>
  <textarea id="modalText" spellcheck="false"></textarea>
  <button class="btn" id="modalOk">Готово</button>
  <button class="btn" id="modalClose">Закрыть</button>
</div></div>

<script>
/* =========================================================================
   СЦЕНКИ — движок. Правь тут: state, SCENES, ACTIONS.
   ========================================================================= */

const SAVE_KEY = "scenki.save.v1";

/* ---------- состояние ---------- */
const defaultState = () => ({
  stage: "start",          // start | undress | foreplay | oral | sex | climax | after
  clothes: { top: true, bottom: true, bra: true, panties: true },
  arousal: 0,              // 0..100
  wetness: 0,              // 0..100
  mood: "neutral",         // neutral | playful | hot | shy | dominant
  rounds: 0,               // счётчик действий
  climaxed: 0,             // сколько раз кончил
  started: Date.now(),
  log: [],                 // {t:"narr"|"act"|"sys"|"climax", text}
});

let S = load() || defaultState();

/* ---------- пулы текстов (вариативность) ---------- */
const POOLS = {
  undress_top: [
    "Стягиваю с неё футболку — медленно, по сантиметру, чтобы почувствовать, как она выгибается.",
    "Тяну за край, ткань скользит вверх, обнажая живот, рёбра, грудь.",
    "Снимаю верх — она прикусывает губу и отводит взгляд.",
  ],
  undress_bottom: [
    "Расстёгиваю и тяну вниз. Джинсы уходят по бёдрам, по коленям, к щиколоткам.",
    "Снимаю низ. Она остаётся в трусиках, и я вижу, как ткань намокает.",
    "Стягиваю до конца, помогаю выйти из штанин.",
  ],
  undress_bra: [
    "Расстёгиваю застёжку одним движением. Бретельки падают, грудь освобождается.",
    "Лифчик летит на пол. Соски твёрдые, я накрываю ладонями.",
  ],
  undress_panties: [
    "Тяну трусики вниз по ногам. Ткань липнет к коже, она краснеет.",
    "Снимаю последнее. Она теперь полностью передо мной — и не прячется.",
  ],
  kiss: [
    "Целую в шею, под челюсть, за ухом — туда, где пульс.",
    "Ловлю её губы, втягиваю нижнюю, кусаю едва-едва.",
    "Руки на талии, лоб ко лбу, дышим в такт.",
  ],
  touch: [
    "Провожу ладонью по внутренней стороне бедра — выше, выше, до самой границы.",
    "Глажу живот, спускаюсь ниже, чувствую, как она втягивает воздух.",
    "Пальцами по клитору — мягко, кругами, не спеша.",
  ],
  oral: [
    "Опускаюсь между ног. Первый поцелуй — прямо в мокрые складочки.",
    "Языком по клитору — медленно, а потом быстрее, ровно в её темп.",
    "Она зарывается пальцами мне в волосы и держит.",
  ],
  receive: [
    "Она встаёт на колени. Расстёгивает мне ремень, пуговицу, молнию.",
    "Берёт в руку, обводит головку языком, смотрит мне в глаза.",
    "Губы смыкаются. Двигается медленно, потом глубже.",
  ],
  sex: [
    "Вхожу. Медленно, до конца, даю привыкнуть.",
    "Двигаюсь ровно, глубоко, слышу, как она стонет в подушку.",
    "Она сверху, задаёт ритм, я держу её за бёдра.",
  ],
  faster: [
    "Ускоряюсь. Кровать бьётся о стену.",
    "Темп растёт — она вцепляется в простыню.",
  ],
  slower: [
    "Замедляюсь до томительного, почти останавливаюсь.",
    "Медленно, глубоко, с паузой на входе.",
  ],
  climax: [
    "Она сжимается вокруг меня и кончает — долго, с дрожью.",
    "Я за ней. Всё тело выгибает, дыхание рвётся.",
  ],
  after: [
    "Лежим. Она кладёт голову мне на грудь, я глажу её по спине.",
    "Молчим. Только дыхание понемногу выравнивается.",
  ],
};

/* ---------- действия: id -> {label, key, check, run} ---------- */
const ACTIONS = {
  undress_top:    {label:"Снять верх",       key:"1", stage:["start","undress"],     clothes:"top",     narr:"undress_top",    arousal:+6,  mood:"playful"},
  undress_bottom: {label:"Снять низ",        key:"2", stage:["start","undress"],     clothes:"bottom",  narr:"undress_bottom", arousal:+6,  mood:"playful"},
  undress_bra:    {label:"Снять лифчик",     key:"3", stage:["undress"],             clothes:"bra",     narr:"undress_bra",    arousal:+9,  mood:"shy",      need:{top:false}},
  undress_panties:{label:"Снять трусики",    key:"4", stage:["undress"],             clothes:"panties", narr:"undress_panties",arousal:+14, mood:"hot",      need:{bottom:false}},
  kiss:           {label:"Поцеловать",       key:"5", stage:["start","foreplay"],    narr:"kiss",   arousal:+7,  wetness:+4, mood:"playful"},
  touch:          {label:"Ласкать пальцами", key:"6", stage:["foreplay","oral"],     narr:"touch",  arousal:+12, wetness:+14, mood:"hot",      need:{panties:false}},
  oral_give:      {label:"Куни",             key:"7", stage:["foreplay","oral"],     narr:"oral",   arousal:+18, wetness:+18, mood:"hot",      need:{panties:false}},
  oral_receive:   {label:"Минет",            key:"8", stage:["oral","sex"],          narr:"receive",arousal:+20, wetness:+6,  mood:"dominant"},
  sex:            {label:"Секс",             key:"9", stage:["oral","sex"],          narr:"sex",    arousal:+16, wetness:+8,  mood:"hot",      need:{panties:false}, advance:"sex"},
  faster:         {label:"Ускориться",       key:"q", stage:["sex"],                 narr:"faster", arousal:+10, wetness:+4,  mood:"hot"},
  slower:         {label:"Замедлиться",      key:"w", stage:["sex"],                 narr:"slower", arousal:+4,  wetness:+4,  mood:"hot"},
  climax:         {label:"Кончить",          key:"e", stage:["sex","oral"],          narr:"climax", arousal:+22, wetness:+8,  mood:"hot",      advance:"climax"},
  after:          {label:"После",            key:"r", stage:["climax"],              narr:"after",  arousal:0,   wetness:0,   mood:"neutral",  advance:"after"},
};

/* ---------- утилиты ---------- */
const $ = s => document.querySelector(s);
const pick = a => a[Math.floor(Math.random()*a.length)];
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const fmtTime = ms => {const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");};

/* ---------- лог ---------- */
function log(text, t="narr"){
  S.log.push({t, text});
  if(S.log.length > 200) S.log.shift();
  renderLog();
}
function renderLog(){
  const el = $("#log");
  el.innerHTML = S.log.map(l => `<p class="${l.t}">${esc(l.text)}</p>`).join("");
  el.scrollTop = el.scrollHeight;
}
function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}

/* ---------- звук (WebAudio, без файлов) ---------- */
let AC = null, soundOn = false;
function beep(freq, dur=0.08, type="sine", vol=0.05){
  if(!soundOn) return;
  AC = AC || new (window.AudioContext||window.webkitAudioContext)();
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.value = vol;
  o.connect(g); g.connect(AC.destination);
  o.start(); o.stop(AC.currentTime + dur);
}

/* ---------- рендер ---------- */
function render(){
  document.body.dataset.stage = S.stage;
  document.body.classList.toggle("high", S.arousal >= 70);

  // возбуждение
  document.documentElement.style.setProperty("--arousal", S.arousal + "%");
  $("#arousalBar").style.width = S.arousal + "%";
  $("#arousalTxt").textContent = S.arousal + "%" + (S.wetness>60 ? " · мокрая" : "");

  // одежда
  const names = {top:"верх", bottom:"низ", bra:"лифчик", panties:"трусики"};
  $("#clothes").innerHTML = Object.entries(S.clothes)
    .map(([k,v]) => `<span class="${v?"on":""}">${names[k]}</span>`).join("");

  // спрайт-плейсхолдер по стадии
  const icons = {start:"🛏️", undress:"👗", foreplay:"💋", oral:"💦", sex:"🔥", climax:"✨", after:"🕯️"};
  $("#sprite").textContent = icons[S.stage] || "🛏️";
  $("#stageLabel").textContent = ({start:"начало",undress:"раздевание",foreplay:"прелюдия",oral:"орально",sex:"секс",climax:"разрядка",after:"после"})[S.stage] || S.stage;

  // действия
  renderActions();
}

function available(a){
  if(a.stage && !a.stage.includes(S.stage)) return false;
  if(a.clothes && !S.clothes[a.clothes]) return false;
  if(a.need){ for(const [k,v] of Object.entries(a.need)) if(S.clothes[k] !== v) return false; }
  // секс только если раздета
  if(a.clothes==="panties" && !S.clothes.bottom) return false;
  return true;
}

function renderActions(){
  const box = $("#actions");
  box.innerHTML = "";
  for(const [id,a] of Object.entries(ACTIONS)){
    if(!available(a)) continue;
    const b = document.createElement("button");
    b.className = "btn" + (S.arousal>=70 ? " hot" : "");
    b.innerHTML = `<span class="key">${a.key}</span>${a.label}`;
    b.onclick = () => doAction(id);
    box.appendChild(b);
  }
  // если нечего — кнопка «после»
  if(!box.children.length){
    const b = document.createElement("button");
    b.className = "btn"; b.textContent = "Завершить";
    b.onclick = () => doAction("after");
    box.appendChild(b);
  }
}

/* ---------- выполнение действия ---------- */
function doAction(id){
  const a = ACTIONS[id];
  if(!a) return;

  // снять одежду
  if(a.clothes) S.clothes[a.clothes] = false;

  // возбуждение / влажность
  if(a.arousal) S.arousal = clamp(S.arousal + a.arousal, 0, 100);
  if(a.wetness) S.wetness = clamp(S.wetness + a.wetness, 0, 100);
  if(a.mood) S.mood = a.mood;

  // текст
  if(a.narr){
    const line = pick(POOLS[a.narr] || [a.label]);
    log(line, a.narr==="climax" ? "climax" : "act");
  }

  // авто-стадия
  if(a.advance) S.stage = a.advance;
  else if(S.stage==="start" && (id.startsWith("undress") || id==="kiss")) S.stage = "foreplay";
  else if(S.stage==="foreplay" && (id==="oral_give"||id==="oral_receive")) S.stage = "oral";
  else if(S.arousal>=60 && ["foreplay","oral"].includes(S.stage) && id==="sex") S.stage = "sex";

  S.rounds++;
  beep(300 + S.arousal*4, 0.06, "sine", 0.04);

  if(S.arousal>=100 && S.stage!=="climax"){
    S.stage = "climax";
    log("Оргазм. Всё сжимается, дыхание рвётся.", "climax");
    beep(520, 0.25, "triangle", 0.07);
  }

  render();
  save(true);
}

/* ---------- сохранение ---------- */
function save(silent){
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify(S));
    if(!silent) toast("Сохранено");
  }catch(e){ toast("Не сохранилось"); }
}
function load(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return null;
    const d = JSON.parse(raw);
    return Object.assign(defaultState(), d);
  }catch(e){ return null; }
}

/* ---------- тост ---------- */
let toastT;
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove("show"), 1600);
}

/* ---------- таймер ---------- */
setInterval(()=>{
  if(S.started) $("#timer").textContent = fmtTime(Date.now() - S.started);
}, 1000);

/* ---------- горячие клавиши ---------- */
document.addEventListener("keydown", e=>{
  const k = e.key.toLowerCase();
  const entry = Object.entries(ACTIONS).find(([,a])=>a.key===k && available(a));
  if(entry) doAction(entry[0]);
  if(k==="escape") $("#modal").classList.remove("open");
});

/* ---------- кнопки UI ---------- */
$("#btnSave").onclick = () => save();
$("#btnSound").onclick = e => { soundOn = !soundOn; e.target.textContent = soundOn?"🔊":"🔇"; toast(soundOn?"Звук вкл":"Звук выкл"); };
$("#btnReset").onclick = () => { if(confirm("Сбросить игру?")){ localStorage.removeItem(SAVE_KEY); S = defaultState(); init(); } };

$("#btnExport").onclick = () => {
  $("#modalTitle").textContent = "Экспорт";
  $("#modalText").value = btoa(unescape(encodeURIComponent(JSON.stringify(S))));
  $("#modal").classList.add("open");
  $("#modalText").select();
};
$("#btnImport").onclick = () => {
  $("#modalTitle").textContent = "Импорт (вставь строку)";
  $("#modalText").value = "";
  $("#modal").classList.add("open");
};
$("#modalOk").onclick = () => {
  if($("#modalTitle").textContent.startsWith("Импорт")){
    try{
      const d = JSON.parse(decodeURIComponent(escape(atob($("#modalText").value.trim()))));
      S = Object.assign(defaultState(), d);
      $("#modal").classList.remove("open");
      init(); toast("Загружено");
    }catch(e){ toast("Битый код"); return; }
  } else {
    $("#modal").classList.remove("open");
  }
};
$("#modalClose").onclick = () => $("#modal").classList.remove("open");

/* ---------- старт ---------- */
function init(){
  if(!S.log.length){
    log("Комната. Свет приглушён. Она сидит на краю кровати и смотрит на тебя.", "sys");
    log("Начни с малого — поцелуй, прикосновение, а дальше по её дыханию.", "sys");
  }
  render();
}
init();
</script>
</body>
  </html>
